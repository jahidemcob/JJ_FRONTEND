<div class="form-container">
  <h2>Editar Usuario</h2>

  <form *ngIf="user" #form="ngForm" (ngSubmit)="guardar(form)">
    <!-- NOMBRE -->
    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input
        id="nombre"
        type="text"
        [(ngModel)]="user.nombre"
        name="nombre"
        required
        #nombre="ngModel"
      />
    </div>

    <!-- USUARIO -->
    <div class="form-group">
      <label for="nombreUsuario">Usuario</label>
      <input
        id="nombreUsuario"
        type="text"
        [(ngModel)]="user.nombreUsuario"
        name="nombreUsuario"
        required
        #nombreUsuario="ngModel"
      />
    </div>

    <!-- TELÉFONO -->
    <div class="form-group">
      <label for="telefono">Teléfono</label>
      <input
        id="telefono"
        type="text"
        [(ngModel)]="user.telefono"
        name="telefono"
        required
        pattern="[0-9]{10}"
        #telefono="ngModel"
      />
    </div>

    <!-- CORREO -->
    <div class="form-group">
      <label for="correo">Correo</label>
      <input
        id="correo"
        type="email"
        [(ngModel)]="user.correo"
        name="correo"
        required
        email
        #correo="ngModel"
      />
    </div>

    <!-- CONTRASEÑA -->
    <div class="form-group">
      <label for="nuevaClave">Nueva Contraseña</label>
      <input
        id="nuevaClave"
        type="password"
        [(ngModel)]="nuevaClave"
        name="nuevaClave"
        minlength="6"
        placeholder="Ingrese nueva contraseña si desea cambiarla"
        #nuevaClaveModel="ngModel"
      />
    </div>

    <!-- ROL -->
    <div class="form-group">
      <label for="idRol">Rol</label>
      <select [(ngModel)]="user.idRol" name="idRol" required #rol="ngModel" id="idRol">
        <option [ngValue]="null" disabled>Seleccione un rol</option>
        <option [value]="2">Empleado</option>
        <option [value]="3">Cliente</option>
      </select>
    </div>

    <!-- BLOQUE DE ERRORES UNIFICADO -->
    <div
      class="error"
      *ngIf="
        form.touched || form.dirty || errores.general || errores.nombreUsuario || errores.correo
      "
    >
      <!--  BACKEND -->
      <span *ngIf="errores.nombreUsuario">
        {{ errores.nombreUsuario }}
      </span>

      <span *ngIf="!errores.nombreUsuario && errores.correo">
        {{ errores.correo }}
      </span>

      <span *ngIf="!errores.nombreUsuario && !errores.correo && errores.general">
        {{ errores.general }}
      </span>

      <!--  FRONTEND -->
      <span
        *ngIf="
          !errores.nombreUsuario &&
          !errores.correo &&
          !errores.general &&
          (nombre.errors?.['required'] ||
            nombreUsuario.errors?.['required'] ||
            telefono.errors?.['required'] ||
            correo.errors?.['required'] ||
            rol.errors?.['required'])
        "
      >
        Todos los campos deben estar diligenciados correctamente
      </span>

      <span
        *ngIf="
          !errores.nombreUsuario &&
          !errores.correo &&
          !errores.general &&
          !nombre.errors?.['required'] &&
          !nombreUsuario.errors?.['required'] &&
          !telefono.errors?.['required'] &&
          telefono.errors?.['pattern']
        "
      >
        El teléfono debe tener 10 dígitos numéricos
      </span>

      <span
        *ngIf="
          !errores.nombreUsuario &&
          !errores.correo &&
          !errores.general &&
          !nombre.errors?.['required'] &&
          !nombreUsuario.errors?.['required'] &&
          !telefono.errors?.['required'] &&
          !telefono.errors?.['pattern'] &&
          !correo.errors?.['required'] &&
          correo.invalid
        "
      >
        El correo no es válido
      </span>

      <span
        *ngIf="!errores.general && nuevaClave && nuevaClave.length > 0 && nuevaClave.length < 6"
      >
        La contraseña debe tener al menos 6 caracteres
      </span>
    </div>

    <!-- BOTÓN -->
    <button
      class="btn-save"
      type="submit"
      [disabled]="form.invalid || (nuevaClave && nuevaClave.length > 0 && nuevaClave.length < 6)"
    >
      Guardar cambios
    </button>
  </form>
</div>
