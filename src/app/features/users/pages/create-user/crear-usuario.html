<div class="form-container">
  <h2>Crear Usuario</h2>

  <form #form="ngForm" (ngSubmit)="guardar(form)">
    <!-- NOMBRE -->
    <div class="form-group">
      <label>Nombre</label>
      <input [(ngModel)]="usuario.nombre" name="nombre" required #nombre="ngModel" />
    </div>

    <!-- USUARIO -->
    <div class="form-group">
      <label>Usuario</label>
      <input
        [(ngModel)]="usuario.nombreUsuario"
        name="nombreUsuario"
        required
        #nombreUsuario="ngModel"
      />
    </div>

    <!-- TELÉFONO -->
    <div class="form-group">
      <label>Teléfono</label>
      <input
        [(ngModel)]="usuario.telefono"
        name="telefono"
        required
        pattern="[0-9]{10}"
        #telefono="ngModel"
      />
    </div>

    <!-- CORREO -->
    <div class="form-group">
      <label>Correo</label>
      <input
        [(ngModel)]="usuario.correo"
        name="correo"
        type="email"
        required
        email
        #correo="ngModel"
      />
    </div>

    <!-- CLAVE -->
    <div class="form-group">
      <label>Clave (mínimo 6 caracteres)</label>
      <input
        type="password"
        [(ngModel)]="usuario.clave"
        name="clave"
        required
        minlength="6"
        #clave="ngModel"
      />
    </div>

    <!-- ROL -->
    <div class="form-group">
      <label>Rol</label>
      <select [(ngModel)]="usuario.idRol" name="idRol" required #rol="ngModel">
        <option [ngValue]="null" disabled>Seleccione un rol</option>
        <option [value]="2">Empleado</option>
        <option [value]="3">Cliente</option>
      </select>
    </div>

    <div
      class="error"
      *ngIf="
        form.touched || form.dirty || errores.general || errores.nombreUsuario || errores.correo
      "
    >
      <span *ngIf="errores.nombreUsuario">
        {{ errores.nombreUsuario }}
      </span>

      <span *ngIf="!errores.nombreUsuario && errores.correo">
        {{ errores.correo }}
      </span>

      <span *ngIf="!errores.nombreUsuario && !errores.correo && errores.general">
        {{ errores.general }}
      </span>

      <span
        *ngIf="
          !errores.nombreUsuario &&
          !errores.correo &&
          !errores.general &&
          (nombre.errors?.['required'] ||
            nombreUsuario.errors?.['required'] ||
            telefono.errors?.['required'] ||
            correo.errors?.['required'] ||
            clave.errors?.['required'] ||
            rol.errors?.['required'])
        "
      >
        Todos los campos deben estar diligenciados correctamente
      </span>

      <span
        *ngIf="
          !errores.nombreUsuario &&
          !errores.correo &&
          !errores.general &&
          !nombre.errors?.['required'] &&
          !nombreUsuario.errors?.['required'] &&
          !telefono.errors?.['required'] &&
          telefono.errors?.['pattern']
        "
      >
        El teléfono debe tener 10 dígitos numéricos
      </span>

      <span
        *ngIf="
          !errores.nombreUsuario &&
          !errores.correo &&
          !errores.general &&
          !nombre.errors?.['required'] &&
          !nombreUsuario.errors?.['required'] &&
          !telefono.errors?.['required'] &&
          !telefono.errors?.['pattern'] &&
          !correo.errors?.['required'] &&
          correo.invalid
        "
      >
        El correo no es válido
      </span>

      <span
        *ngIf="
          !errores.nombreUsuario &&
          !errores.correo &&
          !errores.general &&
          !nombre.errors?.['required'] &&
          !nombreUsuario.errors?.['required'] &&
          !telefono.errors?.['required'] &&
          !correo.errors?.['required'] &&
          clave.errors?.['minlength']
        "
      >
        La contraseña debe tener al menos 6 caracteres
      </span>
    </div>

    <!-- BOTÓN -->
    <button class="btn-save" type="submit" [disabled]="form.invalid">Guardar</button>
  </form>
</div>
