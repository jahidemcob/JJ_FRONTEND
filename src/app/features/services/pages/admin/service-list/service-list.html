<div class="cards-container">
  <!-- HEADER -->
  <div class="cards-header">
    <h2>Gestión de Servicios</h2>
    <button class="btn-create" (click)="goToCreate()">+ Crear Servicio</button>
  </div>

  <!-- SCROLL -->
  <div class="cards-scroll">
    <div class="cards-grid">
      <div class="service-card" *ngFor="let s of services; trackBy: trackById">
        <div class="card-content">
          <h3 class="service-name">{{ s.nombreServicio }}</h3>

          <p class="service-description">
            {{ s.descripcion }}
          </p>

          <p class="service-price">$ {{ s.precioBase | number: '1.0-0' }}</p>

          <span class="status" [class.activo]="s.isActive" [class.inactivo]="!s.isActive">
            {{ s.isActive ? 'Activo' : 'Inactivo' }}
          </span>
        </div>

        <div class="card-actions">
          <button class="btn-edit">Editar</button>
          <button class="btn-state">
            {{ s.isActive ? 'Desactivar' : 'Activar' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
