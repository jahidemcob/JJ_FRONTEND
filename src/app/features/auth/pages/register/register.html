<div class="register-container">

  <img src="assets/logo.png" class="logo" />

  <div class="register-card">
    <h2>Crea tu cuenta</h2>

    <form (ngSubmit)="registrar(form)" #form="ngForm">

      <div class="input-group">
        <label>Nombre completo</label>
        <input type="text" name="nombre" ngModel required placeholder="Ingresa tu nombre">
      </div>

      <div class="input-group">
        <label>Usuario</label>
        <input type="text" name="usuario" ngModel required placeholder="Crea un usuario">
      </div>

      <div class="input-group">
        <label>Teléfono</label>
        <input type="tel" name="telefono" ngModel required placeholder="Ingresa tu teléfono">
      </div>

      <div class="input-group">
        <label>Correo electrónico</label>
        <input type="email" name="correo" ngModel required placeholder="Ingresa tu correo">
      </div>

      <div class="input-group">
        <label>Clave (minimo 6 caracteres)</label>
        <input type="password" name="clave" ngModel required placeholder="Crea una contraseña">
      </div>

      <div class="input-group">
        <label>Confirmar contraseña</label>
        <input type="password" name="confirmarClave" ngModel required placeholder="Repite la contraseña">
      </div>

      <button type="submit">Registrarse</button>

      <!-- MENSAJE -->
      <p *ngIf="mensaje" class="mensaje">{{ mensaje }}</p>

      <p class="login-link">
        ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
      </p>

    </form>
  </div>
</div>
