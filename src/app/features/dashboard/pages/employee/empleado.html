<div class="dashboard">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <ul>

      <li (click)="ir('/empleado/citas')">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="white"
          stroke-width="2"
        >
          <rect x="3" y="4" width="18" height="18" rx="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span class="text">Citas</span>
      </li>

      <li (click)="ir('/empleado/servicios')">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="white"
          stroke-width="2"
        >
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
        </svg>
        <span class="text">Servicios</span>
      </li>

      <li (click)="ir('/empleado/perfil')">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="white"
          stroke-width="2"
        >
          <circle cx="12" cy="7" r="4"></circle>
          <path d="M5.5 21a6.5 6.5 0 0 1 13 0"></path>
        </svg>
        <span class="text">Perfil</span>
      </li>
    </ul>
  </div>

  <!-- CONTENIDO -->
  <div class="main-content">
    <!-- TOPBAR -->
    <div class="topbar">
      <div class="profile-box">
        <div class="avatar"></div>
        <span class="username">Empleado</span>
        <button class="arrow" (click)="toggleMenu()">▼</button>
      </div>

      <div class="dropdown" *ngIf="menuAbierto">
        <p (click)="cerrarSesion()">Cerrar sesión</p>
      </div>
    </div>

    <!-- CONTENIDO -->
    <div class="content">
      <!-- MENSAJE DE BIENVENIDA -->
      <div class="welcome" *ngIf="router.url === '/empleado'">
        <h1>Bienvenido</h1>
        <p>Selecciona una acción en el panel</p>
      </div>

      <!-- CONTENIDO DE RUTAS -->
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
