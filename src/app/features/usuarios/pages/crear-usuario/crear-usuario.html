<div class="form-container">
  <h2>Crear Usuario</h2>

  <div class="form-group">
    <label>Nombre</label>
    <input [(ngModel)]="usuario.nombre" placeholder="Nombre">
  </div>

  <div class="form-group">
    <label>Usuario</label>
    <input [(ngModel)]="usuario.usuario" placeholder="Usuario">
  </div>

  <div class="form-group">
    <label>Teléfono</label>
    <input [(ngModel)]="usuario.telefono" placeholder="Teléfono">
  </div>

  <div class="form-group">
    <label>Correo</label>
    <input [(ngModel)]="usuario.correo" placeholder="Correo">
  </div>

  <div class="form-group">
    <label>Clave</label>
    <input type="password" [(ngModel)]="usuario.clave" placeholder="Clave">
  </div>

  <div class="form-group">
    <label>Rol</label>
    <select [(ngModel)]="usuario.idRol">
      <option [value]="2">Empleado</option>
      <option [value]="3">Cliente</option>
    </select>
  </div>

  <button class="btn-save" (click)="guardar()">Guardar</button>
</div>
