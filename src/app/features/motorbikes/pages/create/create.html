<div class="form-container">
  <h2>Crear Motocicleta</h2>

  <form #form="ngForm" (ngSubmit)="createMotorbike(form)">
    <!-- MARCA -->
    <div class="form-group">
      <label>Marca</label>
      <input [(ngModel)]="motorbike.marca" name="marca" required #marca="ngModel" />
    </div>

    <!-- MODELO -->
    <div class="form-group">
      <label>Modelo</label>
      <input [(ngModel)]="motorbike.modelo" name="modelo" required #modelo="ngModel" />
    </div>

    <!-- PLACA -->
    <div class="form-group">
      <label>Placa</label>
      <input
        [(ngModel)]="motorbike.placa"
        name="placa"
        required
        pattern="^[A-Za-z]{3}[0-9]{2}[A-Za-z]$"
        #placa="ngModel"
      />
    </div>

    <!-- CILINDRAJE -->
    <div class="form-group">
      <label>Cilindraje</label>
      <input
        type="number"
        [(ngModel)]="motorbike.cilindraje"
        name="cilindraje"
        required
        min="1"
        #cilindraje="ngModel"
      />
    </div>

    <!-- AÑO -->
    <div class="form-group">
      <label>Año</label>
      <input
        type="number"
        [(ngModel)]="motorbike.anio"
        name="anio"
        required
        min="2010"
        #anio="ngModel"
      />
    </div>

    <!-- VALIDACIONES -->
    <div class="error" *ngIf="form.touched || form.dirty">
      <!-- 1. CAMPOS VACÍOS -->
      <span
        *ngIf="
          marca.errors?.['required'] ||
          modelo.errors?.['required'] ||
          placa.errors?.['required'] ||
          cilindraje.errors?.['required'] ||
          anio.errors?.['required']
        "
      >
        Todos los campos deben estar diligenciados correctamente
      </span>

      <!-- 2. PLACA -->
      <span
        *ngIf="
          !marca.errors?.['required'] &&
          !modelo.errors?.['required'] &&
          !placa.errors?.['required'] &&
          placa.errors?.['pattern']
        "
      >
        La placa debe tener formato XXX11X
      </span>

      <!-- 3. CILINDRAJE -->
      <span
        *ngIf="
          !marca.errors?.['required'] &&
          !modelo.errors?.['required'] &&
          !placa.errors?.['required'] &&
          !placa.errors?.['pattern'] &&
          !cilindraje.errors?.['required'] &&
          cilindraje.errors?.['min']
        "
      >
        El cilindraje debe ser mayor a 0
      </span>

      <!-- 4. AÑO -->
      <span
        *ngIf="
          !marca.errors?.['required'] &&
          !modelo.errors?.['required'] &&
          !placa.errors?.['required'] &&
          !placa.errors?.['pattern'] &&
          !cilindraje.errors?.['required'] &&
          !cilindraje.errors?.['min'] &&
          !anio.errors?.['required'] &&
          anio.errors?.['min']
        "
      >
        El año debe ser mayor a 2009
      </span>
    </div>

    <!-- ERROR BACK -->
    <div class="error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <!-- SUCCESS -->
    <div class="success" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <!-- BOTÓN -->
    <button class="btn-save" type="submit" [disabled]="form.invalid || loading">
      Crear Motocicleta
    </button>
  </form>
</div>
