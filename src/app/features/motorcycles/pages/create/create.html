<div class="form-container">
  <h2>Crear Motocicleta</h2>

  <form>
    <!-- MARCA -->
    <div class="form-group">
      <label>Marca</label>
      <input placeholder="Ej: Yamaha" />
    </div>

    <!-- MODELO -->
    <div class="form-group">
      <label>Modelo</label>
      <input placeholder="Ej: R15" />
    </div>

    <!-- PLACA -->
    <div class="form-group">
      <label>Placa</label>
      <input placeholder="Ej: ABC123" />
    </div>

    <!-- CILINDRAJE -->
    <div class="form-group">
      <label>Cilindraje</label>
      <input type="number" placeholder="Ej: 150" />
    </div>

    <!-- ERROR VISUAL -->
    <div class="error">
      Todos los campos deben estar diligenciados correctamente
    </div>

    <!-- BOTÓN -->
    <button class="btn-save" type="button">
      Crear Motocicleta
    </button>
  </form>
</div>
