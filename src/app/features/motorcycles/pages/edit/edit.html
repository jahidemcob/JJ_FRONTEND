<div class="form-container">
  <h2>Editar Motocicleta</h2>

  <form>
    <!-- MARCA -->
    <div class="form-group">
      <label>Marca</label>
      <input value="Yamaha" />
    </div>

    <!-- MODELO -->
    <div class="form-group">
      <label>Modelo</label>
      <input value="R15" />
    </div>

    <!-- PLACA -->
    <div class="form-group">
      <label>Placa</label>
      <input value="ABC123" />
    </div>

    <!-- CILINDRAJE -->
    <div class="form-group">
      <label>Cilindraje</label>
      <input type="number" value="150" />
    </div>

    <!-- ESTADO (VISUAL) -->
    <div class="form-group">
      <label>Estado</label>
      <select>
        <option selected>Activo</option>
        <option>Inactivo</option>
      </select>
    </div>

    <!-- ERROR VISUAL -->
    <div class="error">
      Todos los campos deben estar diligenciados correctamente
    </div>

    <!-- BOTÓN -->
    <button class="btn-save" type="button">
      Actualizar Motocicleta
    </button>
  </form>
</div>
