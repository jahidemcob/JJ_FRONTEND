<div class="layout-cita">

  <!-- IZQUIERDA -->
  <div class="table-container">

    <!-- HEADER -->
    <div class="table-header">
      <h2>Solicitar Cita</h2>
    </div>

    <!-- FILTROS -->
    <div class="filtros-cita">
      
      <div class="campo">
        <label>Fecha</label>
        <select>
          <option>Hoy</option>
          <option>Mañana</option>
          <option>Pasado mañana</option>
        </select>
      </div>

      <div class="campo">
        <label>Hora</label>
        <select>
          <option>09:00 AM</option>
          <option>10:00 AM</option>
          <option>11:00 AM</option>
          <option>12:00 PM</option>
          <option>01:00 PM</option>
          <option>02:00 PM</option>
          <option>03:00 PM</option>
          <option>04:00 PM</option>
        </select>
      </div>

    </div>

    <!-- SERVICIOS (VIENEN DEL BACK) -->
    <div class="cards-container">

      <div class="cards-header">
        <h2>Servicios Disponibles</h2>
      </div>

      <div class="cards-scroll">
        <div class="cards-grid">

          <!-- 🔥 SOLO LOOP REAL -->
          <div 
            class="service-card"
            *ngFor="let s of services; trackBy: trackById"
          >
            <div class="card-content">

              <h3 class="service-name">
                {{ s.nombreServicio }}
              </h3>

              <p class="service-description">
                {{ s.descripcion }}
              </p>

              <p class="service-price">
                $ {{ s.precioBase | number:'1.0-0' }}
              </p>

              <button class="btn-add">
                Agregar
              </button>

            </div>
          </div>

        </div>
      </div>

    </div>

  </div>

  <!-- DERECHA -->
  <div class="resumen-cita">

    <!-- 🔥 SOLO PARTE VISUAL NUEVA -->
    <div class="campo-resumen">
      <label>Motocicleta</label>
      <select>
        <option>Yamaha R15 - ABC123</option>
        <option>Honda CB190R - XYZ789</option>
        <option>AKT NKD 125 - LMN456</option>
      </select>
    </div>

    <h3>Servicios seleccionados</h3>

    <ul class="lista-resumen">
      <li>
        <div class="item-info">
          <span>Cambio de aceite</span>
          <small>$ 15.000</small>
        </div>
        <span class="delete">🗑</span>
      </li>

      <li>
        <div class="item-info">
          <span>Frenos</span>
          <small>$ 20.000</small>
        </div>
        <span class="delete">🗑</span>
      </li>
    </ul>

    <div class="total-cita">
      <span>Total</span>
      <strong>$ 35.000</strong>
    </div>

    <button class="btn-solicitar">
      Solicitar cita
    </button>

  </div>

</div>
